name: Windows build
on:
  push:
    branches: ['**']
    tags: ['desktop-v*']
    paths:
      [
        'coopseat/**',
        'packages/**',
        'package.json',
        'package-lock.json',
        '.github/workflows/desktop.yml',
      ]
  pull_request:
    paths:
      [
        'coopseat/**',
        'packages/**',
        'package.json',
        'package-lock.json',
        '.github/workflows/desktop.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    # Tag releases upload the installers from this job; a second job + artifacts
    # hits Actions storage quota (recalculated only every 6–12h after deletes).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: coopseat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Tag matches coopseat/package.json version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("desktop-v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match coopseat/package.json version $version"
            exit 1
          }
      - run: npm ci
        working-directory: .
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Portable build (reuses the native core and renderer built above)
        run: npx electron-builder --win portable --x64 --config portable.config.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installers
        # Manual runs only — branch/PR builds do not keep ~180MB binaries in artifact storage.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: CoopSeat-Windows-x64
          path: |
            coopseat/release/*-Setup.exe
            coopseat/release/*-Portable.exe
          if-no-files-found: error
          retention-days: 1
      - name: Extract changelog section
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: .
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^desktop-v',''
          node .cursor/skills/semver-release/scripts/release.mjs notes desktop $version | Set-Content -Encoding utf8 notes.md
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: CoopSeat ${{ env.VERSION }}
          body_path: notes.md
          files: |
            coopseat/release/*-Setup.exe
            coopseat/release/*-Portable.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
