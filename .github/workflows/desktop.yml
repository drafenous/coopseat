name: Windows build
on:
  push:
    branches: ['**']
    tags: ['desktop-v*']
    paths:
      [
        'coopseat-desktop/**',
        'packages/**',
        'package.json',
        'package-lock.json',
        '.github/workflows/desktop.yml',
      ]
  pull_request:
    paths:
      [
        'coopseat-desktop/**',
        'packages/**',
        'package.json',
        'package-lock.json',
        '.github/workflows/desktop.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    # Tag releases upload the installers from this job; a second job + artifacts
    # hits Actions storage quota (recalculated only every 6–12h after deletes).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: coopseat-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Tag matches coopseat-desktop/package.json version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("desktop-v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match coopseat-desktop/package.json version $version"
            exit 1
          }
      - run: npm ci
        working-directory: .
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Portable build (reuses the native core and renderer built above)
        run: npx electron-builder --win portable --x64 --config portable.config.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installers
        # Manual runs only — branch/PR builds do not keep ~180MB binaries in artifact storage.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: CoopSeat-Windows-x64
          path: |
            coopseat-desktop/release/*-Setup.exe
            coopseat-desktop/release/*-Portable.exe
          if-no-files-found: error
          retention-days: 1
      - name: Extract changelog section
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: .
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^desktop-v',''
          node .cursor/skills/semver-release/scripts/release.mjs notes desktop $version | Set-Content -Encoding utf8 notes.md
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: CoopSeat ${{ env.VERSION }}
          body_path: notes.md
          files: |
            coopseat-desktop/release/*-Setup.exe
            coopseat-desktop/release/*-Portable.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Publish installers to R2
        # Versioned keys: downloads.coopseat.com/<version>/CoopSeat-<version>-Setup.exe
        # Requires CLOUDFLARE_ACCOUNT_ID and a token with Workers R2 Storage Edit.
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: .
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: coopseat-downloads
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            Write-Error "Set the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets before publishing a desktop tag."
            exit 1
          }
          $files = @(
            "CoopSeat-$env:VERSION-Setup.exe",
            "CoopSeat-$env:VERSION-Portable.exe"
          )
          foreach ($name in $files) {
            $path = "coopseat-desktop/release/$name"
            if (-not (Test-Path $path)) {
              Write-Error "Missing $path"
              exit 1
            }
            npm exec -w coopseat-signal -- wrangler r2 object put "$env:R2_BUCKET/$env:VERSION/$name" --file="$path" --content-type=application/octet-stream --remote
          }
