name: Windows build
on:
  push:
    branches: ['**']
    tags: ['desktop-v*']
    paths:
      [
        'coopseat-desktop/**',
        'packages/**',
        'package.json',
        'package-lock.json',
        '.github/workflows/desktop.yml',
      ]
  pull_request:
    paths:
      [
        'coopseat-desktop/**',
        'packages/**',
        'package.json',
        'package-lock.json',
        '.github/workflows/desktop.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    # Tag releases upload the installers from this job; a second job + artifacts
    # hits Actions storage quota (recalculated only every 6–12h after deletes).
    # Production secrets exist only on a desktop tag. Other runs leave this empty.
    environment: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'production' || '' }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: coopseat-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Tag matches coopseat-desktop/package.json version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("desktop-v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match coopseat-desktop/package.json version $version"
            exit 1
          }
      - run: npm ci
        working-directory: .
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Portable build (reuses the native core and renderer built above)
        run: npx electron-builder --win portable --x64 --config portable.config.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: MSIX build (reuses the native core and renderer built above)
        run: node scripts/dist-msix.mjs
      - name: Upload installers
        # Manual runs only — branch/PR builds do not keep ~180MB binaries in artifact storage.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: CoopSeat-Windows-x64
          path: |
            coopseat-desktop/release/*-Setup.exe
            coopseat-desktop/release/*-Portable.exe
            coopseat-desktop/release/*.msix
          if-no-files-found: error
          retention-days: 1
      - name: Extract changelog section
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: .
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^desktop-v',''
          node .cursor/skills/semver-release/scripts/release.mjs notes desktop $version | Set-Content -Encoding utf8 notes.md
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: CoopSeat ${{ env.VERSION }}
          body_path: notes.md
          files: |
            coopseat-desktop/release/*-Setup.exe
            coopseat-desktop/release/*-Portable.exe
            coopseat-desktop/release/*.msix
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Publish installers to R2
        # Object keys on the coopseat-downloads bucket, served by its r2.dev URL:
        # <version>/CoopSeat-<version>-Setup.exe, -Portable.exe and .msix
        # Requires the production environment secrets CLOUDFLARE_ACCOUNT_ID and
        # CLOUDFLARE_API_TOKEN (Workers R2 Storage Edit).
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: .
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: coopseat-downloads
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            Write-Error "Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN on the production environment before publishing a desktop tag."
            exit 1
          }
          $files = @(
            "CoopSeat-$env:VERSION-Setup.exe",
            "CoopSeat-$env:VERSION-Portable.exe",
            "CoopSeat-$env:VERSION.msix"
          )
          foreach ($name in $files) {
            # npm exec -w runs Wrangler inside coopseat-signal, so a relative path
            # would be resolved there and miss release/ at the repository root.
            $path = Join-Path $env:GITHUB_WORKSPACE "coopseat-desktop\release\$name"
            if (-not (Test-Path -LiteralPath $path)) {
              Write-Error "Missing $path"
              exit 1
            }
            npm exec -w coopseat-signal -- wrangler r2 object put "$env:R2_BUCKET/$env:VERSION/$name" --file="$path" --content-type=application/octet-stream --remote
          }
      - name: Set up Microsoft Store CLI
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: microsoft/microsoft-store-apppublisher@v1.4
      - name: Publish MSIX to Partner Center
        # Submits the package already built above. The Store signs it during
        # certification. The app's first submission has to be live already;
        # this CLI path updates free products.
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PARTNER_CENTER_PRODUCT_ID: ${{ secrets.PARTNER_CENTER_PRODUCT_ID }}
        run: |
          $required = @(
            'PARTNER_CENTER_TENANT_ID',
            'PARTNER_CENTER_SELLER_ID',
            'PARTNER_CENTER_CLIENT_ID',
            'PARTNER_CENTER_CLIENT_SECRET',
            'PARTNER_CENTER_PRODUCT_ID'
          )
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace((Get-Item "Env:$_").Value)
          })
          if ($missing.Count -gt 0) {
            Write-Error "Set $($missing -join ', ') on the production environment before publishing a desktop tag. The Entra application needs the Manager role in Partner Center."
            exit 1
          }
          $msix = Join-Path (Get-Location) "release\CoopSeat-$env:VERSION.msix"
          if (-not (Test-Path -LiteralPath $msix)) {
            Write-Error "Missing $msix"
            exit 1
          }
          msstore reconfigure --tenantId $env:PARTNER_CENTER_TENANT_ID --sellerId $env:PARTNER_CENTER_SELLER_ID --clientId $env:PARTNER_CENTER_CLIENT_ID --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET
          msstore publish "$msix" --appId $env:PARTNER_CENTER_PRODUCT_ID
