name: Web

on:
  push:
    branches: [main]
    paths: ['coopseat-web/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
  pull_request:
    paths: ['coopseat-web/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coopseat-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npx prisma contract emit
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck -w @coopseat/ui
        working-directory: .
      - run: npm test
      - run: npm run build
        env:
          APP_URL: https://coopseat.com

  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: coopseat-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npx prisma contract emit
      - run: npx prisma db migrate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
      - run: npm run db:sql
        env:
          SQL_ADMIN_URL: ${{ secrets.SQL_ADMIN_URL }}
