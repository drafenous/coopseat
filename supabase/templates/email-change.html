<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#0b0d12;font-family:Arial,Helvetica,sans-serif;color:#e6e8ee">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#151922;border-radius:12px;padding:32px">
          <tr><td>
            <h1 style="margin:0 0 16px;font-size:22px;color:#fff">Confirme a troca de e-mail</h1>
            <p style="margin:0 0 24px;line-height:1.5">Confirme a alteração do e-mail da sua conta CoopSeat de {{ .Email }} para {{ .NewEmail }}.</p>
            <p style="margin:0 0 24px">
              <a href="{{ .SiteURL }}/api/auth/confirm?token_hash={{ .TokenHash }}&type=email_change"
                 style="display:inline-block;background:#6d5efc;color:#fff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:bold">Confirmar troca</a>
            </p>
            <p style="margin:0;font-size:12px;color:#8a90a0">Se não foi você, altere sua senha imediatamente.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
